<!doctype html>
<html>
<head><meta charset="utf-8"><title>Spinner preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',gap:'16px',alignItems:'center',padding:'16px',color:'var(--text-accent)'}},
    h(T.Spinner,{size:16}), h(T.Spinner), h(T.Spinner,{size:24}), h('span',{className:'ui',style:{color:'var(--text-muted)'}},'Loading cases')));
</script>
</body>
</html>
