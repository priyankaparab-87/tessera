<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'12px',padding:'16px'}},
    h(T.Alert,{tone:'info',title:'Your export is running'},'You can leave this page. We’ll email you when the file is ready.'),
    h(T.Alert,{tone:'success',title:'Case closed',dismissible:true}),
    h(T.Alert,{tone:'warning',title:'Credit approval pending'},'A manager approves credits over 20%.'),
    h(T.Alert,{tone:'critical',title:'Couldn’t save the case',action:h(T.Button,{size:'sm'},'Try again')},'Check your connection and try again.')));
</script>
</body>
</html>
