<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'12px',padding:'16px'}},
    h(T.Switch,{defaultChecked:true},'Email updates'), h(T.Switch,null,'Show closed cases'), h(T.Switch,{disabled:true},'Auto-assign')));
</script>
</body>
</html>
