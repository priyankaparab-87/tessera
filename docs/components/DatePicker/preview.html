<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatePicker preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  var d = new Date(); d.setDate(d.getDate() + 4);
  var t = new Date(d); t.setHours(14, 30, 0, 0);
  root.render(h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '24px', padding: '16px', alignItems: 'flex-start' } },
    h('div', { style: { width: '280px' } }, h(T.DatePicker, { label: 'Due date', defaultValue: d, open: true })),
    h('div', { style: { width: '280px', display: 'flex', flexDirection: 'column', gap: '16px' } },
      h(T.DatePicker, { label: 'Publish at', withTime: true, defaultValue: t, description: 'Date and time, 24-hour' }),
      h(T.DatePicker, { label: 'Follow-up', placeholder: 'Select date' }))));
</script>
</body>
</html>
