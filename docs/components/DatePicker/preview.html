<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatePicker preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px',maxWidth:'320px'}},h(T.DatePicker,{label:'Follow-up date',open:true,defaultValue:new Date(2026,8,18)})));
</script>
</body>
</html>
