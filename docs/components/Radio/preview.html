<!doctype html>
<html>
<head><meta charset="utf-8"><title>Radio preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap',padding:'16px'}},h(T.Radio,{name:'r',defaultChecked:true},'Selected'),h(T.Radio,{name:'r'},'Unselected'),h(T.Radio,{name:'r2',disabled:true},'Disabled')));
</script>
</body>
</html>
