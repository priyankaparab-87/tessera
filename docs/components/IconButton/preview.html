<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',gap:'12px',alignItems:'center',padding:'16px'}},
    h(T.IconButton,{icon:'more-vertical',label:'More actions'}), h(T.IconButton,{icon:'edit',label:'Edit',variant:'secondary'}),
    h(T.IconButton,{icon:'plus',label:'Add',variant:'primary'}), h(T.IconButton,{icon:'trash',label:'Delete',tone:'critical'}),
    h(T.IconButton,{icon:'close',label:'Close',size:'sm'}), h(T.IconButton,{icon:'refresh',label:'Refresh',disabled:true})));
</script>
</body>
</html>
