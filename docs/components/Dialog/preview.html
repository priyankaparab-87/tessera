<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{height:'400px'}},h(T.Dialog,{inline:true,title:'Edit case details',subtitle:'CS-137 · Waiting on manager approval',onClose:function(){},footer:[h(T.Button,{key:1},'Cancel'),h(T.Button,{key:2,variant:'primary'},'Save changes')]},h(T.TextField,{label:'Title',defaultValue:'Waiting on manager approval for credit'}),h(T.Select,{label:'Priority',defaultValue:'High',options:['Low','Medium','High']}))));
</script>
</body>
</html>
