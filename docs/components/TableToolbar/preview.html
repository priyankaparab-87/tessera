<!doctype html>
<html>
<head><meta charset="utf-8"><title>TableToolbar preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px'}},h(T.TableToolbar,{selectedCount:3,bulkActions:[h(T.Button,{key:1,size:'sm'},'Assign'),h(T.Button,{key:2,size:'sm'},'Change status'),h(T.Button,{key:3,size:'sm',tone:'critical'},'Delete')]})));
</script>
</body>
</html>
