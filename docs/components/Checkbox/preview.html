<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'12px',padding:'16px'}},
    h(T.Checkbox,{defaultChecked:true},'Notify the assignee'), h(T.Checkbox,null,'Include closed cases'),
    h(T.Checkbox,{indeterminate:true},'Select all'), h(T.Checkbox,{disabled:true},'Archive automatically')));
</script>
</body>
</html>
