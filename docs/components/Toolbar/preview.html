<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toolbar preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px'}},h('div',{style:{border:'1px solid var(--border)',borderRadius:'10px',background:'var(--surface)'}},h(T.Toolbar,{start:[h(T.SegmentedControl,{key:1,size:'sm',defaultValue:'b',items:[{id:'l',label:'List'},{id:'b',label:'Board'}]}),h(T.Divider,{key:2,vertical:true}),h(T.Button,{key:3,size:'sm',variant:'tertiary',iconStart:'sort'},'Sort')],end:[h(T.ToggleButton,{key:1,size:'sm',icon:'columns',label:'Columns'}),h(T.Button,{key:2,size:'sm',iconStart:'download'},'Export')]}))));
</script>
</body>
</html>
