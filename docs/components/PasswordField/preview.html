<!doctype html>
<html>
<head><meta charset="utf-8"><title>PasswordField preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px',maxWidth:'360px'}},h(T.PasswordField,{label:'API secret',defaultValue:'tessera-demo-secret',description:'Stored encrypted. Rotate every 90 days.'})));
</script>
</body>
</html>
