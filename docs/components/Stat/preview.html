<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stat preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'16px',padding:'16px',alignItems:'start'}},h(T.Stat,{label:'Open cases',value:'128',delta:'+12',period:'vs last week',positive:false,help:'Cases not yet closed'}),h(T.Stat,{label:'Median first reply',value:'1h 42m',delta:'-18%',period:'vs last week',positive:true}),h(T.Stat,{label:'CSAT',value:'94%',delta:'+2 pts',period:'30d'}),h(T.Stat,{label:'Refunds',value:'€ 8.2k',delta:'0%',trend:'flat',period:'30d'})));
</script>
</body>
</html>
