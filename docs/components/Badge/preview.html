<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap',padding:'16px'}},h(T.Badge,null,'Low'),h(T.Badge,{tone:'warning'},'Medium'),h(T.Badge,{tone:'critical'},'High'),h(T.Badge,{tone:'info'},'In progress'),h(T.Badge,{tone:'success',icon:'check'},'Closed'),h(T.Badge,{tone:'accent'},'VIP'),h(T.Badge,{tone:'new'},'New')));
</script>
</body>
</html>
