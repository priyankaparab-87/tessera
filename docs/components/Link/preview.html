<!doctype html>
<html>
<head><meta charset="utf-8"><title>Link preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',gap:'16px',alignItems:'center',padding:'16px'}},
    h(T.Link,{href:'#'},'Dana Whitfield'), h(T.Link,{href:'#',subtle:true},'View history'), h(T.Link,{href:'#',external:true},'Carrier tracking')));
</script>
</body>
</html>
