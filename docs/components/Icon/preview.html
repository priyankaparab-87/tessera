<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  var names = T.Icon.names;
  render(h('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(96px,1fr))',gap:'4px',padding:'16px',color:'var(--text-subtle)'}},
    names.map(function(n){ return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',padding:'10px 4px'}},
      h(T.Icon,{name:n,size:24}), h('span',{className:'small',style:{color:'var(--text-muted)',textAlign:'center'}},n)); })));
</script>
</body>
</html>
