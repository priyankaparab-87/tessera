<!doctype html>
<html>
<head><meta charset="utf-8"><title>CheckboxGroup preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px'}},h(T.CheckboxGroup,{label:'Notify me about',defaultValue:['new','esc'],options:[{value:'new',label:'New cases assigned to me'},{value:'esc',label:'Escalations'},{value:'closed',label:'Cases closed by others'}]})));
</script>
</body>
