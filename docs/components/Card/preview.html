<head><meta charset="utf-8"><title>Card preview</title></head>

  function render(el) { root.render(el); }

      h('div',{className:'ui'},'Primary contact: ',h(T.Link,{href:'#'},'Harbor Supply Co.'))),
    h(T.Card,{padding:'compact',flat:true},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},h(T.Link,{href:'#'},'CS-136'),h(T.Badge,{tone:'critical'},'High')),
      h('div',{className:'ui'},'Waiting on manager approval for credit'),
      h('div',{className:'small',style:{color:'var(--text-muted)'}},'2 Sep 2026, 10:12'))));
</script>
</body>
