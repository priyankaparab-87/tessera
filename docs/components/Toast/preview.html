<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px'}},h(T.Toast,{tone:'success',title:'Case closed',action:'Undo'}),h(T.Toast,{tone:'critical',title:'Couldn’t send the email'},'The customer’s address bounced.'),h(T.Toast,{tone:'neutral',title:'Export started',action:'View'},'We’ll notify you when it’s ready.')));
</script>
</body>
</html>
