<!doctype html>
<html>
<head><meta charset="utf-8"><title>MultiSelect preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'16px',padding:'16px',maxWidth:'360px'}},h(T.MultiSelect,{label:'Labels',open:true,defaultValue:['Refund','Damaged'],options:['Refund','Damaged','Late delivery','Wrong item','VIP']})));
</script>
</body>
</html>
