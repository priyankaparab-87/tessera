<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateRangePicker preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var s = new Date(today); s.setDate(s.getDate() - 6);
  var ws = new Date(today); ws.setHours(9, 0, 0, 0); var we = new Date(today); we.setDate(we.getDate() + 2); we.setHours(17, 30, 0, 0);
  root.render(h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '24px', padding: '16px', alignItems: 'flex-start' } },
    h('div', { style: { width: '416px' } }, h(T.DateRangePicker, { label: 'Created', defaultValue: [s, today], open: true })),
    h('div', { style: { width: '416px' } }, h(T.DateRangePicker, { label: 'Maintenance window', withTime: true, defaultValue: [ws, we], presets: false }))));
</script>
</body>
</html>
