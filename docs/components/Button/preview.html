<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'flex',flexDirection:'column',gap:'12px',padding:'16px'}},
    h('div',{style:{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}},
      h(T.Button,{variant:'primary'},'Create case'), h(T.Button,null,'Export'), h(T.Button,{variant:'tertiary',iconStart:'filter'},'Filters'),
      h(T.Button,{variant:'primary',tone:'critical'},'Delete case'), h(T.Button,{variant:'primary',loading:true},'Saving'), h(T.Button,{disabled:true},'Disabled')),
    h('div',{style:{display:'flex',gap:'12px',alignItems:'center'}},
      h(T.Button,{variant:'primary',size:'sm'},'Small'), h(T.Button,{variant:'primary'},'Medium'), h(T.Button,{variant:'primary',size:'lg'},'Large'))));
</script>
</body>
</html>
