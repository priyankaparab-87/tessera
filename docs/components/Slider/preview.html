<!doctype html>
<html>
<head><meta charset="utf-8"><title>Slider preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'16px',padding:'16px',alignItems:'start'}},h(T.Slider,{label:'Match threshold',defaultValue:70,unit:'%'}),h(T.Slider,{label:'Volume',defaultValue:30,disabled:true})));
</script>
</body>
</html>
