<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function render(el) { root.render(el); }
  render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:'16px',padding:'16px'}},
    h(T.TextField,{label:'Case title',required:true,placeholder:'Describe the issue'}),
    h(T.TextField,{label:'Order ID',defaultValue:'ORD-48213',description:'Shown on the customer’s invoice.'}),
    h(T.TextField,{label:'Credit',defaultValue:'120',suffix:'%',error:'Enter a value up to 100.'}),
    h(T.TextField,{label:'Customer ID',defaultValue:'5508214470',disabled:true})));
</script>
</body>
</html>
